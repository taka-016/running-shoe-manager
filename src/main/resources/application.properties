# Datasource
# ローカル実行時は localhost、コンテナ実行時は docker-compose の環境変数で上書きします
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/shoes_management}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:user}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:password}

# Hibernateの設定（テーブルを自動作成する）
# none:何もしない(デフォルト)
# validate:テーブル構造を検証し、Entityと不一致があれば起動しない
# update:起動時にテーブルがなければ作成し、あれば変更点を適用
# create:起動時に既存テーブルを削除し、再作成する
# create-drop:createと同様に加え、アプリケーション終了時にテーブルを削除
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
